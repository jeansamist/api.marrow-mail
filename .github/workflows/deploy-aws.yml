name: Build, Push, and Deploy to AWS

# ---------------------------------------------------------------------------
# Branch -> environment
#
#   main     -> production   api.marrowmails.com
#   staging  -> staging      staging-api.marrowmails.com
#   dev      -> dev          dev-api.marrowmails.com
#
# All three run in the same ECS cluster behind the same ALB, split by
# host-header rules on the HTTPS:443 listener. Each environment has its own
# task definition family, target group, log group, Secrets Manager secret and
# Neon database. The container image is identical across all three — only
# configuration differs, which is what makes a staging deploy a meaningful
# rehearsal for production.
#
# Required GitHub secrets
#   AWS_ACCOUNT_ID          e.g. 123456789012
#   AWS_REGION              e.g. us-east-1
#   AWS_ACCESS_KEY_ID       deploy user's key
#   AWS_SECRET_ACCESS_KEY   deploy user's secret
#   ECR_REPOSITORY          e.g. api-marrowmail
#   ECS_CLUSTER             cluster name or ARN (shared by all environments)
#   ECS_SUBNETS             comma-separated subnet IDs for the migration task
#   ECS_SECURITY_GROUPS     comma-separated SG IDs for the migration task.
#                           Must be the TASKS security group (marrowmail-tasks-sg),
#                           not the ALB one, and must be able to reach Neon.
#
# Optional repository variable
#   ECS_ASSIGN_PUBLIC_IP    ENABLED | DISABLED (default ENABLED — the subnets
#                           are public and have no NAT gateway, so tasks need a
#                           public IP to reach ECR and Secrets Manager)
#
# IAM permissions for the deploy user:
#   ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload,
#   ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:BatchGetImage
#   ecs:RegisterTaskDefinition, ecs:RunTask, ecs:DescribeTasks,
#   ecs:UpdateService, ecs:DescribeServices
#   secretsmanager:DescribeSecret on each environment's secret
#   iam:PassRole for the task and execution roles
#   logs:GetLogEvents on /ecs/marrow-mail-api*
#
# NOTE: the task definition deliberately has no container-level `healthCheck`.
# The ALB target group already health-checks the container, and a container
# health check would also run inside the one-off migration task below — where
# nothing is listening on port 80 — and could kill that task mid-migration.
#
# NOTE: .aws/task-definition.json is a TEMPLATE full of <PLACEHOLDER> tokens.
# .aws/render-task-def.py fills them in per environment and resolves the
# Secrets Manager ARN at run time. Never hardcode an account ID or a secret
# ARN suffix in the committed file.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - main
      - staging
      - dev
  workflow_dispatch:

# One deploy at a time per environment. Never cancel mid-deploy — a
# half-applied migration or a partial service update is worse than waiting.
concurrency:
  group: deploy-ecs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CONTAINER_NAME: api-marrowmail

jobs:
  deploy:
    name: Build, migrate, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Single source of truth for which environment this branch deploys to.
      # Everything downstream reads these outputs.
      - name: Resolve environment from branch
        id: envmap
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            main)
              ENVIRONMENT=production
              SERVICE=ApiMarrowmail-service-yx9mklbj
              LOG_GROUP=/ecs/marrow-mail-api
              URL=https://api.marrowmails.com
              ;;
            staging)
              ENVIRONMENT=staging
              SERVICE=marrowmail-staging
              LOG_GROUP=/ecs/marrow-mail-api-staging
              URL=https://staging-api.marrowmails.com
              ;;
            dev)
              ENVIRONMENT=dev
              SERVICE=marrowmail-dev
              LOG_GROUP=/ecs/marrow-mail-api-dev
              URL=https://dev-api.marrowmails.com
              ;;
            *)
              echo "::error::Branch ${GITHUB_REF_NAME} has no environment mapping"
              exit 1
              ;;
          esac
          {
            echo "environment=$ENVIRONMENT"
            echo "service=$SERVICE"
            echo "log_group=$LOG_GROUP"
            echo "url=$URL"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying ${GITHUB_REF_NAME} -> $ENVIRONMENT ($URL)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Layer caching via the GitHub Actions cache. The dependency-install layer
      # is only rebuilt when package.json / pnpm-lock.yaml change, which is the
      # difference between a ~1 minute and a ~5 minute build.
      #
      # Cache scope is per-environment so a dev build cannot evict the cache
      # that production builds depend on.
      - name: Build and push image to Amazon ECR
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ steps.envmap.outputs.environment }}
          cache-from: type=gha,scope=${{ steps.envmap.outputs.environment }}
          cache-to: type=gha,mode=max,scope=${{ steps.envmap.outputs.environment }}

      - name: Render task definition
        id: task-def
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ENVIRONMENT: ${{ steps.envmap.outputs.environment }}
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCOUNT_ID" || { echo "::error::AWS_ACCOUNT_ID secret is empty"; exit 1; }
          python3 .aws/render-task-def.py \
            --env "$ENVIRONMENT" \
            --account-id "$AWS_ACCOUNT_ID" \
            --image "$IMAGE" \
            --region "${{ secrets.AWS_REGION }}" \
            --out /tmp/task-definition.json
          echo "path=/tmp/task-definition.json" >> "$GITHUB_OUTPUT"

      # Registered explicitly so the exact same revision is used to run
      # migrations and then to update the service.
      - name: Register task definition
        id: register
        run: |
          set -euo pipefail
          ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://${{ steps.task-def.outputs.path }}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      # Migrations run as a one-off Fargate task on the NEW image, before any
      # traffic reaches it. A non-zero exit fails the workflow and the running
      # service is left untouched on the previous revision.
      #
      # Retries only when the container never started (exitCode is null), which
      # means an infrastructure fault such as CannotPullContainerError — those
      # are transient on Fargate. A container that ran and exited non-zero is a
      # real migration failure and is NEVER retried: re-running a half-applied
      # migration is how you turn one bad deploy into a corrupted schema.
      - name: Run database migrations
        env:
          TASK_DEF_ARN: ${{ steps.register.outputs.arn }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SUBNETS: ${{ secrets.ECS_SUBNETS }}
          ECS_SECURITY_GROUPS: ${{ secrets.ECS_SECURITY_GROUPS }}
          ASSIGN_PUBLIC_IP: ${{ vars.ECS_ASSIGN_PUBLIC_IP || 'ENABLED' }}
          LOG_GROUP: ${{ steps.envmap.outputs.log_group }}
          MAX_ATTEMPTS: '3'
        run: |
          set -euo pipefail

          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "::group::Migration attempt $attempt of $MAX_ATTEMPTS"

            TASK_ARN=$(aws ecs run-task \
              --cluster "$ECS_CLUSTER" \
              --task-definition "$TASK_DEF_ARN" \
              --launch-type FARGATE \
              --started-by "gha-migrate-${GITHUB_SHA::7}" \
              --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNETS],securityGroups=[$ECS_SECURITY_GROUPS],assignPublicIp=$ASSIGN_PUBLIC_IP}" \
              --overrides "{\"containerOverrides\":[{\"name\":\"$CONTAINER_NAME\",\"command\":[\"node\",\"ace\",\"migration:run\",\"--force\"]}]}" \
              --query 'tasks[0].taskArn' --output text)

            if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
              echo "::endgroup::"
              echo "::error::Could not submit the migration task to ECS"
              exit 1
            fi
            echo "Task: $TASK_ARN"

            aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

            DETAILS=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
              --query "tasks[0].{exit:containers[?name=='$CONTAINER_NAME'].exitCode|[0],stopped:stoppedReason,reason:containers[?name=='$CONTAINER_NAME'].reason|[0]}" \
              --output json)
            EXIT_CODE=$(echo "$DETAILS" | python3 -c "import sys,json;v=json.load(sys.stdin)['exit'];print('null' if v is None else v)")
            STOPPED=$(echo "$DETAILS" | python3 -c "import sys,json;print(json.load(sys.stdin)['stopped'] or '')")

            echo "Exit code: $EXIT_CODE"
            echo "Stopped reason: $STOPPED"

            # The container's own output — the only record of what actually ran.
            aws logs get-log-events \
              --log-group-name "$LOG_GROUP" \
              --log-stream-name "ecs/$CONTAINER_NAME/${TASK_ARN##*/}" \
              --query 'events[].message' --output text 2>/dev/null || echo "(no container logs — it never started)"
            echo "::endgroup::"

            if [ "$EXIT_CODE" = "0" ]; then
              echo "Migrations applied successfully."
              exit 0
            fi

            if [ "$EXIT_CODE" != "null" ]; then
              echo "::error::Migrations ran and failed (exit $EXIT_CODE) — service not updated, not retrying"
              exit 1
            fi

            echo "::warning::Task never started (${STOPPED}) — infrastructure fault, retrying"
            attempt=$((attempt + 1))
            [ "$attempt" -le "$MAX_ATTEMPTS" ] && sleep 20
          done

          echo "::error::Migration task failed to start after $MAX_ATTEMPTS attempts — service not updated"
          exit 1

      - name: Deploy to ECS service
        env:
          TASK_DEF_ARN: ${{ steps.register.outputs.arn }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ steps.envmap.outputs.service }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" \
            --no-cli-pager --query 'service.serviceName' --output text

          echo "Waiting for the service to reach a steady state..."
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          echo "Deployed $TASK_DEF_ARN"

      - name: Smoke test
        env:
          URL: ${{ steps.envmap.outputs.url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL/" || echo 000)
            echo "attempt $i: $CODE"
            [ "$CODE" = "200" ] && { echo "$URL is healthy"; exit 0; }
            sleep 10
          done
          echo "::error::$URL did not return 200 after the deploy"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### ECS deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Environment | \`${{ steps.envmap.outputs.environment }}\` |"
            echo "| URL | ${{ steps.envmap.outputs.url }} |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Task definition | \`${{ steps.register.outputs.arn }}\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
